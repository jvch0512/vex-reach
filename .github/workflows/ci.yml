name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Demo scan produces valid OpenVEX
        run: |
          cargo run -q -- scan examples/py-webapp --advisories examples/advisories.json --out /tmp/vex.json
          cargo run -q -- check /tmp/vex.json
